[project]
name = "agent-harness-hub"
version = "0.4.0"
description = "Hub de prompts, governança e motor universal de aceleração para agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ctx = "ctx.cli:main"

[project.urls]
Repository = "https://github.com/douglaspands/agent-harness-hub"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# Kit instalado pelo `ctx init` em outros projetos (guardrail, template de policy e skill)
ctx = ["kit/*"]
