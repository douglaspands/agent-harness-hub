[project]
name = "agent-harness-hub"
version = "0.5.0"
description = "Hub de prompts, governança e motor universal de aceleração para agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Tudo opcional: sem eles o ctx funciona como antes e o `ctx index` avisa uma vez o que ficou desligado.
c = ["tree-sitter>=0.23", "tree-sitter-c>=0.23"]  # corte de C/H por função/struct (M-03)
semantic = ["model2vec>=0.4"]  # busca semântica local híbrida com o BM25 (M-05)
all = ["agent-harness-hub[c,semantic]"]

[project.scripts]
ctx = "ctx.cli:main"

[project.urls]
Repository = "https://github.com/douglaspands/agent-harness-hub"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# Kit instalado pelo `ctx init` em outros projetos (guardrail, template de policy e skill)
ctx = ["kit/*"]
